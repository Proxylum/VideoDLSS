# Release on a version tag: package only. The tagged commit is the merge commit that the pull-request and main runs of ci.yml
# already built and tested; repeating build-test here would add 20+ minutes on the single self-hosted runner (docs/ci.md).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: [self-hosted, windows, rtx]
    timeout-minutes: 60
    permissions:
      contents: write   # attaching the package to the release of the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          clean: true
      - name: Package
        run: cmd /c scripts\package.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: dlss-video-package-${{ github.ref_name }}
          path: build/release/dlss-video-*.zip
          retention-days: 30
      - name: Attach to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        # cmd, not powershell: under Windows PowerShell 5.1 the "release not found" that the release lookup prints to
        # stderr is a terminating error, so the step died before creating the Release (incident TASK-0037). The script
        # takes the package of the tag's version, creates the Release if needed and is covered by ctest scripts.attach_release.
        shell: cmd
        run: call scripts\attach_release.cmd %GITHUB_REF_NAME% build\release
