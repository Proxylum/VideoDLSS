# CI on a self-hosted Windows runner with an NVIDIA RTX GPU (labels: self-hosted, windows, rtx) — docs/ci.md.
# build-test: configure -> build -> every test (unit, integration, app, golden, GPU) through scripts/ci-build.cmd.
# package: on main and on version tags — scripts/package.cmd; on a tag the ZIP is attached to the GitHub Release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: [self-hosted, windows, rtx]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          clean: true   # git clean -ffdx: every job builds from scratch (vcpkg comes back from the binary cache)
      - name: Configure, build, test
        run: cmd /c scripts\ci-build.cmd
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            build/release/test-report.xml
            build/release/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

  package:
    needs: build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, windows, rtx]
    timeout-minutes: 60
    permissions:
      contents: write   # attaching the package to the release of a tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          clean: true
      - name: Package
        run: cmd /c scripts\package.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: dlss-video-package-${{ github.ref_name }}
          path: build/release/dlss-video-*.zip
          retention-days: 30
      - name: Attach to the release of the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = (Get-ChildItem build/release/dlss-video-*-win64.zip | Select-Object -First 1).FullName
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "dlss-video $($tag.TrimStart('v'))" --generate-notes --verify-tag
          }
