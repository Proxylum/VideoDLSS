# CI on a self-hosted Windows runner with an NVIDIA RTX GPU (labels: self-hosted, windows, rtx) — docs/ci.md.
# build-test: configure -> build -> every test (unit, integration, app, golden, GPU) through scripts/ci-build.cmd,
# on pushes to main, pull requests and manual runs. package: on main — scripts/package.cmd, the ZIP as an artifact.
# Version tags are handled by release.yml (package only: the tagged merge commit was tested here already).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: [self-hosted, windows, rtx]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          clean: true   # git clean -ffdx: every job builds from scratch (vcpkg comes back from the binary cache)
      - name: Configure, build, test
        run: cmd /c scripts\ci-build.cmd
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            build/release/test-report.xml
            build/release/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

  package:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, rtx]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          clean: true
      - name: Package
        run: cmd /c scripts\package.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: dlss-video-package-${{ github.ref_name }}
          path: build/release/dlss-video-*.zip
          retention-days: 30
